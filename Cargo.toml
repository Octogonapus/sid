[package]
name = "sid"
version = "0.1.0"
edition = "2024"
description = "Interactive sed with a live git-style diff preview"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ignore = "0.4.33"
ratatui = "0.30.2"
similar = "3.2.0"
which = "8.0.6"

[dev-dependencies]
tempfile = "3.27.0"
